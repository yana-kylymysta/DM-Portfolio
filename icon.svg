<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0A0A0A"/>

  <!-- 3 vertical fader tracks, centered in the square -->
  <!-- Track positions: 160, 256, 352 -->
  <line x1="160" y1="80"  x2="160" y2="432" stroke="#F5F2ED" stroke-width="10" stroke-linecap="square" opacity="0.30"/>
  <line x1="256" y1="80"  x2="256" y2="432" stroke="#F5F2ED" stroke-width="10" stroke-linecap="square" opacity="0.30"/>
  <line x1="352" y1="80"  x2="352" y2="432" stroke="#F5F2ED" stroke-width="10" stroke-linecap="square" opacity="0.30"/>

  <!-- Tick marks — subtle -->
  <g stroke="#F5F2ED" stroke-width="4" opacity="0.12">
    <line x1="145" y1="160" x2="175" y2="160"/>
    <line x1="145" y1="240" x2="175" y2="240"/>
    <line x1="145" y1="320" x2="175" y2="320"/>
    <line x1="241" y1="200" x2="271" y2="200"/>
    <line x1="241" y1="290" x2="271" y2="290"/>
    <line x1="337" y1="150" x2="367" y2="150"/>
    <line x1="337" y1="250" x2="367" y2="250"/>
    <line x1="337" y1="350" x2="367" y2="350"/>
  </g>

  <!-- Knob 1 (left track) — mid position, white -->
  <rect x="126" y="184" width="68" height="36" fill="#F5F2ED"/>
  <line x1="126" y1="202" x2="194" y2="202" stroke="#888580" stroke-width="3"/>

  <!-- Knob 2 (centre track) — low, ACCENT RED — the hero element -->
  <rect x="222" y="308" width="68" height="36" fill="#FF3B00"/>
  <line x1="222" y1="326" x2="290" y2="326" stroke="#CC2E00" stroke-width="3"/>

  <!-- Knob 3 (right track) — high, white -->
  <rect x="318" y="128" width="68" height="36" fill="#F5F2ED"/>
  <line x1="318" y1="146" x2="386" y2="146" stroke="#888580" stroke-width="3"/>
</svg>